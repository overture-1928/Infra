---
kolla_base_distro: ubuntu
openstack_release: "2026.2"

network_interface: mgmt0
api_interface: mgmt0
tunnel_interface: mgmt0
neutron_external_interface: mgmt0.10
kolla_internal_vip_address: "192.0.2.10"
kolla_external_vip_address: "192.0.2.10"

# Start with OVN so the later Octavia deployment can use its native provider.
# Changing an existing cloud from OVS to OVN is a separate migration.
neutron_plugin_agent: ovn
enable_neutron_provider_networks: "yes"

enable_openstack_core: "yes"
enable_horizon: "no"
enable_skyline: "yes"
skyline_enable_sso: "no"
enable_cinder: "yes"
enable_cinder_backup: "no"
enable_cinder_backend_lvm: "yes"
enable_cinder_backend_iscsi: "yes"
cinder_backend_lvm_name: standard
cinder_volume_group: cinder-ssd
cinder_backends:
  - name: standard
    enabled: true

nova_compute_virt_type: kvm
enable_masakari: "no"

enable_prometheus: "no"
enable_grafana: "no"
enable_opensearch: "no"
enable_fluentd: "yes"

# Zun support was removed from Kolla-Ansible in 2026.1. Managed container
# execution is provided through the Kubernetes platform profile instead.
