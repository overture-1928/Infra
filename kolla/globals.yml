---
kolla_base_distro: ubuntu
openstack_release: "2026.2"

network_interface: mgmt0
api_interface: mgmt0
tunnel_interface: mgmt0
neutron_external_interface: mgmt0.10
kolla_internal_vip_address: "192.0.2.10"
kolla_external_vip_address: "192.0.2.10"

# OVN is used from the first three-node deployment so Octavia can later use its
# native provider without a Neutron backend migration.
neutron_plugin_agent: ovn
enable_neutron_provider_networks: "yes"

enable_openstack_core: "yes"
enable_horizon: "no"
enable_skyline: "yes"
skyline_enable_sso: "no"
enable_cinder: "yes"
enable_cinder_backup: "no"
enable_cinder_backend_lvm: "no"
enable_cinder_backend_iscsi: "no"
cinder_backend_ceph: "yes"
cinder_backend_ceph_name: ceph-rbd
cinder_cluster_name: ceph-rbd
ceph_cinder_user: cinder
ceph_cinder_pool_name: volumes
ceph_glance_user: glance
ceph_glance_pool_name: images
ceph_nova_user: cinder
ceph_nova_pool_name: vms
glance_backend_file: "no"
glance_backend_ceph: "yes"
nova_backend_ceph: "yes"
cinder_backends: []

nova_compute_virt_type: kvm
enable_masakari: "no"

enable_prometheus: "no"
enable_grafana: "no"
enable_opensearch: "no"
enable_fluentd: "yes"

# Zun support was removed from Kolla-Ansible in 2026.1. Managed container
# execution is provided through the Kubernetes platform profile instead.
