---
schema_version: 1

# Public example networks use RFC 5737 documentation ranges. Copy this file
# to openstack-cluster.local.yml and replace every environment-specific value.

cluster:
  api_vip: 192.0.2.10
  timezone: Asia/Seoul
  ssh_private_key: /home/operator/.ssh/id_ed25519
  storage_backend: ceph
  # The first supported deployment is the complete three-node cloud. Managed
  # services remain an explicit later step after OpenStack and Ceph validation.
  platform:
    magnum_capi:
      enabled: false
      hosted_control_plane: false
    container_service:
      enabled: false
      # Zun is not deployable by Kolla-Ansible 2026.2. The supported path is a
      # container API backed by a dedicated Kubernetes runtime cluster.
      provider: kubernetes
  ceph:
    enabled: true
    bootstrap_host: cloud01
    # Dedicated 10Gbps storage network present before the first deployment.
    public_network: 192.168.30.0/24
    cluster_network: ""
    min_link_mbps: 10000
    osd_memory_target_ratio: 0.2
    # images/volumes/vms are pinned to one CRUSH device class. Other classes
    # may exist, but need separate pools and Cinder volume types to be used.
    openstack_pool_device_class: nvme

nodes:
  cloud01:
    enabled: true
    connection: local
    ansible_host: 192.0.2.2
    ansible_user: operator
    management_interface: mgmt0
    # Locally administered example MAC. Replace it in the ignored local copy.
    management_mac: 02:00:00:00:00:01
    management_address: 192.0.2.2/24
    management_gateway: 192.0.2.1
    management_dns:
      - 192.0.2.1
    neutron_external_interface: mgmt0.10
    neutron_external_vlan_id: 10
    os_disk_serial: EXAMPLE-OS-SSD-0001
    require_docker_mount: true
    roles:
      - control
      - network
      - compute
      - monitoring
      - storage
    ceph_interface: ceph0
    ceph_mac: 02:00:00:00:30:01
    ceph_address: 192.168.30.2
    ceph_osd_devices:
      - by_id: /dev/disk/by-id/nvme-EXAMPLE-CLOUD01-CEPH
        serial: EXAMPLE-CLOUD01-CEPH-NVME
        min_size_bytes: 1800000000000
        device_class: nvme

  # All three nodes are required before the first deployment. Replace every
  # example hardware identity in the ignored local copy.
  cloud02:
    enabled: true
    connection: ssh
    ansible_host: 192.0.2.4
    ansible_user: operator
    management_interface: mgmt0
    management_mac: 02:00:00:00:00:02
    management_address: 192.0.2.4/24
    management_gateway: 192.0.2.1
    management_dns:
      - 192.0.2.1
    neutron_external_interface: mgmt0.10
    neutron_external_vlan_id: 10
    os_disk_serial: EXAMPLE-CLOUD02-OS-SSD
    require_docker_mount: false
    roles:
      - control
      - network
      - compute
      - storage
    ceph_interface: ceph0
    ceph_mac: 02:00:00:00:30:02
    ceph_address: 192.168.30.4
    ceph_osd_devices:
      - by_id: /dev/disk/by-id/nvme-EXAMPLE-CLOUD02-CEPH
        serial: EXAMPLE-CLOUD02-CEPH-NVME
        min_size_bytes: 1800000000000
        device_class: nvme

  cloud03:
    enabled: true
    connection: ssh
    ansible_host: 192.0.2.5
    ansible_user: operator
    management_interface: mgmt0
    management_mac: 02:00:00:00:00:03
    management_address: 192.0.2.5/24
    management_gateway: 192.0.2.1
    management_dns:
      - 192.0.2.1
    neutron_external_interface: mgmt0.10
    neutron_external_vlan_id: 10
    os_disk_serial: EXAMPLE-CLOUD03-OS-SSD
    require_docker_mount: false
    roles:
      - control
      - network
      - compute
      - storage
    ceph_interface: ceph0
    ceph_mac: 02:00:00:00:30:03
    ceph_address: 192.168.30.5
    ceph_osd_devices:
      - by_id: /dev/disk/by-id/nvme-EXAMPLE-CLOUD03-CEPH
        serial: EXAMPLE-CLOUD03-CEPH-NVME
        min_size_bytes: 1800000000000
        device_class: nvme
