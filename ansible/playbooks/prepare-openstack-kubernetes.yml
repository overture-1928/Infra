---
- name: Prepare OpenStack instances for Kubespray
  hosts: kube_node
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('24.04', '>=')

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Prevent swap from returning after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S*\s+\S+\s+swap\s+.*)$'
        replace: '# disabled for Kubernetes: \1'

    - name: Install Kubernetes host prerequisites
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - python3
          - python3-apt
          - python3-netaddr
          - socat
        state: present
