---
- name: Apply a reviewed OpenWrt network plan with an armed rollback guard
  hosts: openwrt
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    openwrt_plan_path: "{{ playbook_dir }}/../../.cache/openwrt/plan.json"
    openwrt_uci_batch_path: "{{ playbook_dir }}/../../.cache/openwrt/uci.batch"
    openwrt_state_root: "{{ playbook_dir }}/../../state/openwrt"
  pre_tasks:
    - name: Require exactly one OpenWrt router
      ansible.builtin.assert:
        that:
          - groups['openwrt'] | default([]) | length == 1
        fail_msg: The OpenWrt inventory must contain exactly one router.
      run_once: true

    - name: Load the reviewed router plan and UCI batch on the controller
      ansible.builtin.set_fact:
        openwrt_plan: "{{ lookup('ansible.builtin.file', openwrt_plan_path) | from_json }}"
        openwrt_uci_batch: "{{ lookup('ansible.builtin.file', openwrt_uci_batch_path) }}"
      no_log: true

    - name: Derive guarded transaction values
      ansible.builtin.set_fact:
        openwrt_change_id: "{{ openwrt_plan.change_id }}"
        openwrt_expected_network_hash: >-
          {{ openwrt_plan.preconditions.configs.network_sha256 |
             default(openwrt_plan.preconditions.network_sha256 | default('')) }}
        openwrt_expected_firewall_hash: >-
          {{ openwrt_plan.preconditions.configs.firewall_sha256 |
             default(openwrt_plan.preconditions.firewall_sha256 | default('')) }}
        openwrt_expected_dhcp_hash: >-
          {{ openwrt_plan.preconditions.configs.dhcp_sha256 |
             default(openwrt_plan.preconditions.dhcp_sha256 | default('')) }}
        openwrt_rollback_seconds: "{{ openwrt_plan.timeouts.rollback_seconds | default(300) | int }}"
        openwrt_ssh_return_seconds: "{{ openwrt_plan.timeouts.ssh_return_seconds | default(120) | int }}"
        openwrt_apply_attempt: "{{ lookup('ansible.builtin.env', 'OPENWRT_APPLY_ATTEMPT') }}"
        openwrt_remote_transaction: "/root/openwrt-rollback/{{ openwrt_plan.change_id }}"
        openwrt_local_transaction: "{{ openwrt_state_root }}/{{ openwrt_plan.change_id }}"
      no_log: true

    - name: Validate the transaction plan before connecting to the router
      ansible.builtin.assert:
        that:
          - openwrt_plan.schema_version | int == 1
          - openwrt_change_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
          - openwrt_plan.confirmations.apply | default('') | length >= 16
          - openwrt_plan.confirmations.confirm | default('') | length >= 16
          - openwrt_plan.confirmations.rollback | default('') | length >= 16
          - openwrt_expected_network_hash is match('^[0-9a-f]{64}$')
          - openwrt_expected_firewall_hash is match('^[0-9a-f]{64}$')
          - openwrt_expected_dhcp_hash is match('^[0-9a-f]{64}$')
          - openwrt_plan.artifacts.uci_batch_sha256 | default('') is match('^[0-9a-f]{64}$')
          - openwrt_apply_attempt is match('^[0-9a-f]{32}$')
          - openwrt_rollback_seconds | int >= 120
          - openwrt_rollback_seconds | int <= 1800
          - openwrt_ssh_return_seconds | int >= 30
          - openwrt_ssh_return_seconds | int <= openwrt_rollback_seconds | int
        fail_msg: The OpenWrt plan is incomplete or outside the guarded limits.

    - name: Require the exact apply confirmation from the controller environment
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'OPENWRT_APPLY_CONFIRM') == openwrt_plan.confirmations.apply
        fail_msg: OPENWRT_APPLY_CONFIRM does not match the reviewed plan.
      no_log: true

    - name: Inspect the local UCI batch
      ansible.builtin.stat:
        path: "{{ openwrt_uci_batch_path }}"
        checksum_algorithm: sha256
      register: openwrt_uci_batch_stat
      delegate_to: localhost

    - name: Require the exact reviewed UCI batch
      ansible.builtin.assert:
        that:
          - openwrt_uci_batch_stat.stat.isreg | default(false)
          - openwrt_uci_batch_stat.stat.checksum == openwrt_plan.artifacts.uci_batch_sha256
          - "'__OPENWRT_UCI_BATCH__' not in openwrt_uci_batch"
        fail_msg: The UCI batch does not match the reviewed plan.

    - name: Validate each effective UCI operation
      ansible.builtin.assert:
        that:
          - item is match('^(set|add_list|delete|rename|reorder) +(network|firewall|dhcp)[A-Za-z0-9_@.\\[\\]-]*(=.*)?$')
        fail_msg: The UCI batch contains an unsupported operation.
      loop: >-
        {{ openwrt_uci_batch.splitlines()
           | reject('match', '^\\s*(#|$)')
           | map('trim')
           | list }}
      no_log: true

  tasks:
    - name: Require the discovered configuration hashes to remain unchanged
      ansible.builtin.raw: |
        set -eu
        for config in network firewall dhcp; do
          if [ -n "$(uci -q changes "${config}" || true)" ]; then
            echo "Uncommitted UCI changes exist in ${config}." >&2
            exit 1
          fi
        done
        test "$(sha256sum /etc/config/network | awk '{print $1}')" = {{ openwrt_expected_network_hash | quote }}
        test "$(sha256sum /etc/config/firewall | awk '{print $1}')" = {{ openwrt_expected_firewall_hash | quote }}
        test "$(sha256sum /etc/config/dhcp | awk '{print $1}')" = {{ openwrt_expected_dhcp_hash | quote }}
      changed_when: false

    - name: Atomically claim the router-wide apply transaction
      ansible.builtin.raw: |
        set -eu
        umask 077
        root=/root/openwrt-rollback
        claim="${root}/APPLY_LOCK"
        transaction={{ openwrt_remote_transaction | quote }}
        mkdir -p "${root}"
        if ! mkdir "${claim}" 2>/dev/null; then
          owner="$(cat "${claim}/CHANGE_ID" 2>/dev/null || printf 'unknown')"
          echo "Another OpenWrt apply transaction owns the router-wide lock: ${owner}" >&2
          exit 1
        fi
        cleanup_claim() {
          rm -f "${claim}/CHANGE_ID" "${claim}/ATTEMPT_ID"
          rmdir "${claim}" >/dev/null 2>&1 || true
        }
        trap cleanup_claim EXIT
        printf '%s\n' {{ openwrt_change_id | quote }} >"${claim}/CHANGE_ID"
        printf '%s\n' {{ openwrt_apply_attempt | quote }} >"${claim}/ATTEMPT_ID"
        if [ -e /root/openwrt-rollback/current/ARMED ]; then
          echo 'An OpenWrt rollback guard is already armed.' >&2
          exit 1
        fi
        if [ -e "${transaction}" ]; then
          test "$(cat "${transaction}/CHANGE_ID")" = {{ openwrt_change_id | quote }}
          test ! -e "${transaction}/ARMED"
          if [ ! -e "${transaction}/ROLLED_BACK" ] && [ ! -e "${transaction}/FAILED_PRE_ARM" ]; then
            echo 'The transaction directory is neither rolled back nor a pre-arm failure.' >&2
            exit 1
          fi
          archive="${root}/archive/{{ openwrt_change_id }}-{{ openwrt_apply_attempt }}"
          mkdir -p "${root}/archive"
          test ! -e "${archive}"
          if [ "$(readlink /root/openwrt-rollback/current 2>/dev/null || true)" = "${transaction}" ]; then
            rm -f /root/openwrt-rollback/current
          fi
          mv "${transaction}" "${archive}"
        fi
        mkdir "${transaction}"
        printf '%s\n' {{ openwrt_change_id | quote }} >"${transaction}/CHANGE_ID"
        printf '%s\n' {{ openwrt_apply_attempt | quote }} >"${transaction}/ATTEMPT_ID"
        trap - EXIT
      changed_when: true

    - name: Create remote sysupgrade and configuration backups
      ansible.builtin.raw: |
        set -eu
        umask 077
        transaction={{ openwrt_remote_transaction | quote }}
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/CHANGE_ID)" = {{ openwrt_change_id | quote }}
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/ATTEMPT_ID)" = {{ openwrt_apply_attempt | quote }}
        test "$(cat "${transaction}/CHANGE_ID")" = {{ openwrt_change_id | quote }}
        test "$(cat "${transaction}/ATTEMPT_ID")" = {{ openwrt_apply_attempt | quote }}
        sysupgrade -b "${transaction}/sysupgrade-backup.tar.gz"
        (cd / && tar -czf "${transaction}/etc-config.tar.gz" etc/config)
        tar -tzf "${transaction}/sysupgrade-backup.tar.gz" >/dev/null
        tar -tzf "${transaction}/etc-config.tar.gz" >/dev/null
        sha256sum "${transaction}/sysupgrade-backup.tar.gz" >"${transaction}/sysupgrade-backup.tar.gz.sha256"
        sha256sum "${transaction}/etc-config.tar.gz" >"${transaction}/etc-config.tar.gz.sha256"
      changed_when: true

    - name: Create the private controller backup directory
      ansible.builtin.file:
        path: "{{ openwrt_local_transaction }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Build the controller SCP command
      ansible.builtin.set_fact:
        openwrt_scp_base: >-
          {{ ['scp', '-O', '-P', (ansible_port | default(22) | string),
              '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes']
             + ((ansible_ssh_private_key_file | default('') | length > 0)
                | ternary(['-i', ansible_ssh_private_key_file], [])) }}
        openwrt_scp_source: >-
          {{ (ansible_user | default('root')) ~ '@' ~
             (ansible_host | default(inventory_hostname)) ~ ':' ~ openwrt_remote_transaction }}
      no_log: true

    - name: Copy the sysupgrade backup to the controller
      ansible.builtin.command:
        argv: "{{ openwrt_scp_base + [openwrt_scp_source ~ '/sysupgrade-backup.tar.gz', openwrt_local_transaction ~ '/sysupgrade-backup.tar.gz'] }}"
      delegate_to: localhost
      no_log: true
      changed_when: true

    - name: Copy the configuration backup to the controller
      ansible.builtin.command:
        argv: "{{ openwrt_scp_base + [openwrt_scp_source ~ '/etc-config.tar.gz', openwrt_local_transaction ~ '/etc-config.tar.gz'] }}"
      delegate_to: localhost
      no_log: true
      changed_when: true

    - name: Protect the local backup files
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop:
        - "{{ openwrt_local_transaction }}/sysupgrade-backup.tar.gz"
        - "{{ openwrt_local_transaction }}/etc-config.tar.gz"
      delegate_to: localhost

    - name: Install and arm the persistent rollback guard
      ansible.builtin.raw: |
        set -eu
        umask 077
        transaction={{ openwrt_remote_transaction | quote }}
        duration={{ openwrt_rollback_seconds | int }}
        mkdir -p /root/openwrt-rollback
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/CHANGE_ID)" = {{ openwrt_change_id | quote }}
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/ATTEMPT_ID)" = {{ openwrt_apply_attempt | quote }}
        test "$(cat "${transaction}/CHANGE_ID")" = {{ openwrt_change_id | quote }}
        test "$(cat "${transaction}/ATTEMPT_ID")" = {{ openwrt_apply_attempt | quote }}
        test ! -e /root/openwrt-rollback/current/ARMED
        ln -sfn "${transaction}" /root/openwrt-rollback/current

        cat >"${transaction}/rollback.sh" <<'__OPENWRT_ROLLBACK__'
        #!/bin/sh
        set -eu
        transaction={{ openwrt_remote_transaction | quote }}
        change_id={{ openwrt_change_id | quote }}
        attempt_id={{ openwrt_apply_attempt | quote }}
        claim=/root/openwrt-rollback/APPLY_LOCK
        [ -e "${transaction}/ARMED" ] || exit 0
        lock="${transaction}/FINALIZE_LOCK"
        mkdir "${lock}" 2>/dev/null || exit 75
        cleanup_lock() {
          rmdir "${lock}" >/dev/null 2>&1 || true
        }
        abort_rollback() {
          cleanup_lock
          exit 1
        }
        trap cleanup_lock EXIT
        trap abort_rollback HUP INT TERM
        [ -e "${transaction}/ARMED" ] || exit 0
        test "$(cat "${transaction}/CHANGE_ID")" = "${change_id}"
        test "$(cat "${transaction}/ATTEMPT_ID")" = "${attempt_id}"
        test "$(cat "${claim}/CHANGE_ID")" = "${change_id}"
        test "$(cat "${claim}/ATTEMPT_ID")" = "${attempt_id}"
        test "$(readlink /root/openwrt-rollback/current)" = "${transaction}"
        tar -tzf "${transaction}/etc-config.tar.gz" >/dev/null
        tar -xzf "${transaction}/etc-config.tar.gz" -C /
        /etc/init.d/network restart >/tmp/openwrt-rollback-network.log 2>&1
        /etc/init.d/firewall restart >/tmp/openwrt-rollback-firewall.log 2>&1
        /etc/init.d/dnsmasq restart >/tmp/openwrt-rollback-dnsmasq.log 2>&1
        if [ -x /etc/init.d/odhcpd ]; then
          /etc/init.d/odhcpd restart >/tmp/openwrt-rollback-odhcpd.log 2>&1
        fi
        /etc/init.d/openwrt-rollback-guard disable >/dev/null 2>&1
        touch "${transaction}/ROLLED_BACK"
        rm -f "${transaction}/ARMED"
        rm -f /etc/init.d/openwrt-rollback-guard
        rm -f /root/openwrt-rollback/current
        rm -f "${claim}/CHANGE_ID" "${claim}/ATTEMPT_ID"
        rmdir "${claim}"
        __OPENWRT_ROLLBACK__

        cat >"${transaction}/wait-and-rollback.sh" <<'__OPENWRT_WAIT__'
        #!/bin/sh
        set -eu
        transaction={{ openwrt_remote_transaction | quote }}
        [ -e "${transaction}/ARMED" ] || exit 0
        pid_file="${transaction}/GUARD_PID"
        printf '%s\n' "$$" >"${pid_file}"
        cleanup_pid() {
          rm -f "${pid_file}"
        }
        abort_guard() {
          cleanup_pid
          exit 1
        }
        trap cleanup_pid EXIT
        trap abort_guard HUP INT TERM
        duration="$(cat "${transaction}/DURATION")"
        deadline="$(cat "${transaction}/DEADLINE")"
        now="$(date +%s)"
        if [ "${now}" -ge 1600000000 ] && [ "${deadline}" -gt "${now}" ]; then
          remaining="$((deadline - now))"
          if [ "${remaining}" -gt "${duration}" ]; then
            remaining="${duration}"
          fi
          sleep "${remaining}"
        elif [ "${now}" -lt 1600000000 ]; then
          sleep "${duration}"
        fi
        while [ -e "${transaction}/ARMED" ]; do
          /bin/sh "${transaction}/rollback.sh" && exit 0
          sleep 10
        done
        __OPENWRT_WAIT__

        cat >/etc/init.d/openwrt-rollback-guard <<'__OPENWRT_INIT__'
        #!/bin/sh /etc/rc.common
        USE_PROCD=1
        START=99
        STOP=01
        start_service() {
          [ -e /root/openwrt-rollback/current/ARMED ] || return 0
          rmdir /root/openwrt-rollback/current/FINALIZE_LOCK >/dev/null 2>&1 || true
          procd_open_instance guard
          procd_set_param command /bin/sh {{ openwrt_remote_transaction }}/wait-and-rollback.sh
          procd_set_param respawn 60 5 5
          procd_close_instance
        }
        __OPENWRT_INIT__

        chmod 0700 "${transaction}/rollback.sh" "${transaction}/wait-and-rollback.sh" /etc/init.d/openwrt-rollback-guard
        printf '%s\n' "${duration}" >"${transaction}/DURATION"
        now="$(date +%s)"
        printf '%s\n' "$((now + duration))" >"${transaction}/DEADLINE"
        : >"${transaction}/ARMED"
        /etc/init.d/openwrt-rollback-guard enable
        /etc/init.d/openwrt-rollback-guard restart
        attempt=0
        while [ "${attempt}" -lt 20 ]; do
          if [ -s "${transaction}/GUARD_PID" ]; then
            guard_pid="$(cat "${transaction}/GUARD_PID")"
            if kill -0 "${guard_pid}" >/dev/null 2>&1; then
              exit 0
            fi
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        echo 'The OpenWrt rollback guard did not start under procd.' >&2
        exit 1
      changed_when: true

    - name: Transfer the reviewed UCI batch without logging its content
      ansible.builtin.raw: |
        set -eu
        umask 077
        transaction={{ openwrt_remote_transaction | quote }}
        test -e "${transaction}/ARMED"
        test "$(cat "${transaction}/CHANGE_ID")" = {{ openwrt_change_id | quote }}
        test "$(cat "${transaction}/ATTEMPT_ID")" = {{ openwrt_apply_attempt | quote }}
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/CHANGE_ID)" = {{ openwrt_change_id | quote }}
        test "$(cat /root/openwrt-rollback/APPLY_LOCK/ATTEMPT_ID)" = {{ openwrt_apply_attempt | quote }}
        printf '%s' {{ openwrt_uci_batch | b64encode | quote }} | base64 -d >"${transaction}/uci.batch"
      no_log: true
      changed_when: true

    - name: Atomically stage, validate, and commit the UCI batch
      ansible.builtin.raw: |
        set -eu
        transaction={{ openwrt_remote_transaction | quote }}
        change_id={{ openwrt_change_id | quote }}
        attempt_id={{ openwrt_apply_attempt | quote }}
        claim=/root/openwrt-rollback/APPLY_LOCK
        lock="${transaction}/FINALIZE_LOCK"
        if ! mkdir "${lock}" 2>/dev/null; then
          echo 'The rollback transaction is already being finalized.' >&2
          exit 1
        fi
        staged=0
        lock_handed_off=0
        revert() {
          uci -q revert network || true
          uci -q revert firewall || true
          uci -q revert dhcp || true
        }
        cleanup() {
          if [ "${staged}" -eq 1 ]; then
            revert
          fi
          if [ "${lock_handed_off}" -eq 0 ]; then
            rmdir "${lock}" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT
        trap 'exit 1' HUP INT TERM
        test -e "${transaction}/ARMED"
        test "$(cat "${transaction}/CHANGE_ID")" = "${change_id}"
        test "$(cat "${transaction}/ATTEMPT_ID")" = "${attempt_id}"
        test "$(cat "${claim}/CHANGE_ID")" = "${change_id}"
        test "$(cat "${claim}/ATTEMPT_ID")" = "${attempt_id}"
        test "$(readlink /root/openwrt-rollback/current)" = "${transaction}"
        test -s "${transaction}/GUARD_PID"
        guard_pid="$(cat "${transaction}/GUARD_PID")"
        case "${guard_pid}" in
          ''|*[!0-9]*)
            echo 'The rollback guard PID is invalid.' >&2
            exit 1
            ;;
        esac
        kill -0 "${guard_pid}"
        tr '\000' ' ' <"/proc/${guard_pid}/cmdline" | grep -Fq "${transaction}/wait-and-rollback.sh"
        deadline="$(cat "${transaction}/DEADLINE")"
        now="$(date +%s)"
        if [ "${now}" -ge 1600000000 ] && [ "${now}" -ge "${deadline}" ]; then
          echo 'The rollback deadline has already expired; refusing to commit.' >&2
          exit 1
        fi
        for config in network firewall dhcp; do
          if [ -n "$(uci -q changes "${config}" || true)" ]; then
            echo "Uncommitted UCI changes appeared in ${config}; refusing to stage the batch." >&2
            exit 1
          fi
        done
        test "$(sha256sum /etc/config/network | awk '{print $1}')" = {{ openwrt_expected_network_hash | quote }}
        test "$(sha256sum /etc/config/firewall | awk '{print $1}')" = {{ openwrt_expected_firewall_hash | quote }}
        test "$(sha256sum /etc/config/dhcp | awk '{print $1}')" = {{ openwrt_expected_dhcp_hash | quote }}
        if ! uci -q batch <"${transaction}/uci.batch"; then
          exit 1
        fi
        staged=1
        if ! fw4 check >/tmp/openwrt-fw4-check.log 2>&1; then
          cat /tmp/openwrt-fw4-check.log >&2
          exit 1
        fi
        rm -f "${transaction}/RELOAD_COMPLETE"
        uci commit network
        uci commit firewall
        uci commit dhcp
        staged=0
        lock_handed_off=1
        (
          cleanup_reload_lock() {
            rmdir "${lock}" >/dev/null 2>&1 || true
          }
          trap cleanup_reload_lock EXIT
          trap 'exit 1' HUP INT TERM
          sleep 2
          /etc/init.d/network reload >/tmp/openwrt-network-reload.log 2>&1 || /etc/init.d/network restart >/tmp/openwrt-network-restart.log 2>&1
          /etc/init.d/firewall reload >/tmp/openwrt-firewall-reload.log 2>&1 || /etc/init.d/firewall restart >/tmp/openwrt-firewall-restart.log 2>&1
          /etc/init.d/dnsmasq reload >/tmp/openwrt-dnsmasq-reload.log 2>&1 || /etc/init.d/dnsmasq restart >/tmp/openwrt-dnsmasq-restart.log 2>&1
          if [ -x /etc/init.d/odhcpd ]; then
            /etc/init.d/odhcpd reload >/tmp/openwrt-odhcpd-reload.log 2>&1 || /etc/init.d/odhcpd restart >/tmp/openwrt-odhcpd-restart.log 2>&1
          fi
          : >"${transaction}/RELOAD_COMPLETE"
        ) >/dev/null 2>&1 </dev/null &
        reload_pid=$!
        if ! kill -0 "${reload_pid}" >/dev/null 2>&1; then
          lock_handed_off=0
          echo 'The guarded service reload worker did not start.' >&2
          exit 1
        fi
      changed_when: true

    - name: Wait for the router SSH port to return
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) | int }}"
        delay: 3
        timeout: "{{ openwrt_ssh_return_seconds | int }}"
        state: started
      delegate_to: localhost

    - name: Require a completed reload and working raw SSH command
      ansible.builtin.raw: |
        test -e /root/openwrt-rollback/current/ARMED
        test -e /root/openwrt-rollback/current/RELOAD_COMPLETE
        test -s /root/openwrt-rollback/current/GUARD_PID
        guard_pid="$(cat /root/openwrt-rollback/current/GUARD_PID)"
        kill -0 "${guard_pid}"
        printf 'ready\n'
      register: openwrt_ssh_return
      changed_when: false
      retries: 10
      delay: 3
      until: openwrt_ssh_return.rc == 0

    - name: Read desired UCI values after reload
      ansible.builtin.raw: "uci -q get {{ item.key | quote }}"
      loop: "{{ openwrt_plan.verification.uci_equals | default({}) | dict2items }}"
      register: openwrt_applied_uci_values
      changed_when: false

    - name: Require every desired UCI value after reload
      ansible.builtin.assert:
        that:
          - item.stdout | trim == item.item.value | string
        fail_msg: "The applied UCI value does not match {{ item.item.key }}. The rollback guard remains armed."
      loop: "{{ openwrt_applied_uci_values.results | default([]) }}"

    - name: Leave the rollback guard armed for a separate confirmation
      ansible.builtin.raw: |
        test -e /root/openwrt-rollback/current/ARMED
        test "$(cat /root/openwrt-rollback/current/CHANGE_ID)" = {{ openwrt_change_id | quote }}
      changed_when: false
