---
apiVersion: v1
kind: Namespace
metadata:
  name: magnum-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magnum-capi
  namespace: magnum-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: magnum-capi-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: magnum-capi
    namespace: magnum-system
---
apiVersion: v1
kind: Secret
metadata:
  name: magnum-capi-token
  namespace: magnum-system
  annotations:
    kubernetes.io/service-account.name: magnum-capi
type: kubernetes.io/service-account-token
